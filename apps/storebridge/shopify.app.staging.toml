# Staging environment config. This is a separate Shopify app registration
# from the one in shopify.app.toml (production) — Shopify's own multi-env
# guidance is two distinct Partner/Dev Dashboard apps, not one app reused
# across environments. Link it with:
#
#   shopify app config link --config staging
#
# which fills in client_id below and points application_url /
# redirect_urls at the staging deployment.
#
# Deploy with:  pnpm run deploy -- --config staging
# Dev with:     pnpm run dev -- --config staging

client_id = "4e756fbacff648a4dcf28ed39cd7075e"
name = "StoreBridge (staging)"
# Vercel Deployment Protection (SSO/Vercel Authentication) is on for this
# project except on custom domains (verified via Vercel MCP:
# ssoProtection.enabled=true, deploymentType="all_except_custom_domains"),
# and this staging URL isn't a custom domain — so every request needs the
# bypass secret. x-vercel-protection-bypass alone only got the *first*
# full-page load through; client-side fetcher POSTs (e.g.
# ConnectStoreForm's "Send pairing request") don't carry the query param,
# so they need the bypass *cookie* Vercel can set on that first load to
# actually persist. samesitenone (not `true`) is required specifically
# because this app runs inside Shopify's embedded iframe — see
# https://vercel.com/docs/security/deployment-protection/methods-to-bypass-deployment-protection/protection-bypass-automation's
# "within iframes" note. If this still doesn't hold up in practice, the
# more durable fix is a custom domain, which Deployment Protection already
# exempts entirely.
application_url = "https://storebridge-git-staging-akhiakls-projects.vercel.app?x-vercel-protection-bypass=H53OoODYOIes3zLhnuWNkABQw2tMH5pg&x-vercel-set-bypass-cookie=samesitenone"
embedded = true

[access_scopes]
# Keep in sync with shopify.app.toml — same access needs, different app.
# See that file's comment: read_metaobject_definitions confirmed via
# Shopify's docs; metafieldDefinitions' scope(s) still TODO(unverified).
scopes = "read_metaobject_definitions"
use_legacy_install_flow = false

[webhooks]
# Keep in sync with shopify.app.toml's api_version.
api_version = "2026-07"

# Handled by: /app/routes/webhooks.app.uninstalled.tsx
[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

# Handled by: /app/routes/webhooks.app.scopes_update.tsx
[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[auth]
redirect_urls = []

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
