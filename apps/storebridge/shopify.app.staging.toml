# Staging environment config. This is a separate Shopify app registration
# from the one in shopify.app.toml (production) — Shopify's own multi-env
# guidance is two distinct Partner/Dev Dashboard apps, not one app reused
# across environments. Link it with:
#
#   shopify app config link --config staging
#
# which fills in client_id below and points application_url /
# redirect_urls at the staging deployment.
#
# Deploy with:  pnpm run deploy -- --config staging
# Dev with:     pnpm run dev -- --config staging

client_id = "4e756fbacff648a4dcf28ed39cd7075e"
name = "StoreBridge (staging)"
# TODO(unverified): replace with the real staging deployment URL once it
# exists — this is scaffold-standard, not a verified value.
application_url = "https://storebridge-git-staging-akhiakls-projects.vercel.app"
embedded = true

[access_scopes]
# Keep in sync with shopify.app.toml — same access needs, different app.
# See that file's comment for what's confirmed vs. still TODO(unverified).
scopes = "read_metaobject_definitions,write_metaobject_definitions,write_products,write_customers,write_orders"
use_legacy_install_flow = false

[webhooks]
# Keep in sync with shopify.app.toml's api_version.
api_version = "2026-07"

# Handled by: /app/routes/webhooks.app.uninstalled.tsx
[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

# Handled by: /app/routes/webhooks.app.scopes_update.tsx
[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[auth]
redirect_urls = []

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
