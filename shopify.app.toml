# This file stores configurations for your Shopify app.
#
# This is the PRODUCTION environment config: a separate Shopify app
# registration from shopify.app.staging.toml. Deploy with:
#
#   pnpm run deploy -- --config production
#
# (this is also the default config, so plain `pnpm run deploy` / `shopify
# app dev` uses this file unless --config is passed)

client_id = ""
name = "storebridge"
# TODO(unverified): confirm/replace once `shopify app config link` runs against
# the real production app: this is scaffold-standard, not a verified value.
application_url = "https://example.com"
embedded = true

[access_scopes]
# read_metaobject_definitions: confirmed via Shopify's Admin GraphQL docs:
# metaobjectDefinitions "Requires read_metaobject_definitions access scope."
# (app.groups.$groupId.definitions/definitions.server.ts's
# fetchMetaobjectDefinitions).
#
# write_metaobject_definitions: confirmed via shopify.dev's "Manage
# metaobject definitions" guide: metaobjectDefinitionCreate needs both the
# read and write scopes. Used by sync.server.ts's runSyncJob.
#
# write_products / write_customers / write_orders: confirmed via
# shopify.dev's "Manage metafield definitions" guide ("the appropriate
# access scopes for the owner type ... write_products for product
# metafields, or write_customers for customer metafields"): covers
# METAFIELD_OWNER_TYPES' PRODUCT/PRODUCTVARIANT/COLLECTION, CUSTOMER, and
# ORDER entries respectively. write_products also covers collection sync
# (collections.server.ts / syncCollection.server.ts): collections/
# collectionByIdentifier need read_products, collectionCreate/
# collectionUpdate need write_products. Operation shapes checked against
# the pinned 2026-10 schema (graphql-codegen in CI), not just the Dev MCP
# validator, which validated against an older version.
#
# write_content: confirmed via shopify.dev: PAGE, BLOG, and ARTICLE
# objects each "Requires read_content access scope" (or the narrower
# read_online_store_pages for Page/Blog specifically, but content covers
# all three): covers METAFIELD_OWNER_TYPES' remaining PAGE/BLOG/ARTICLE
# entries.
#
# TODO(unverified): SHOP: syncTarget.server.ts's syncShopMetafieldValue
# now actively calls metafieldsSet against the target's Shop, and
# metafieldsSet "requires the same access level needed to mutate the
# owner resource" (shopify.dev), but there's no plain "write_shop"/
# "write_shop_settings" scope in Shopify's canonical scope list, and
# which scope (if any) actually gates shop-owned metafields specifically
# wasn't confirmed this session. If sync calls start failing with a
# permissions error on SHOP-owned metafields specifically, this is why:
# confirm via Shopify Dev MCP and add the real scope name here.
#
# read_legal_policies / write_legal_policies: confirmed via
# `graphql_schema` + `validate_graphql_codeblocks` against Shopify's live
# Admin API (shopify.dev itself was unreachable this session):
# `shopPolicies` requires read_legal_policies, `shopPolicyUpdate` requires
# write_legal_policies and read_legal_policies. Used by
# definitions.server.ts's fetchShopPolicies and syncTarget.server.ts's
# shop-policy sync.
#
# read_metaobjects / write_metaobjects: metaobject *entry* sync
# (metaobjectEntries.server.ts / syncMetaobjectEntry.server.ts). The
# `*_metaobject_definitions` scopes above only cover the schema. Reported
# by validate_graphql_codeblocks: metaobjects/nodes/metaobjectByHandle need
# read_metaobjects, metaobjectUpsert needs write_metaobjects.
#
# read_online_store_navigation / write_online_store_navigation: navigation
# menu sync (menus.server.ts / syncMenu.server.ts). Reported by
# validate_graphql_codeblocks: `menus` needs read_online_store_navigation,
# menuCreate/menuUpdate need both. Adding them asks each installed store to
# approve the new scopes.
#
# read_locations / write_locations: location sync (locations.server.ts /
# syncLocation.server.ts). Per shopify.dev, Location needs read_locations
# (or read_inventory / read_markets_home), and locationAdd/locationEdit
# need write_locations. The extra scopes validate_graphql_codeblocks lists
# for these are alternatives, not requirements.
#
# read_checkout_and_accounts_configurations /
# write_checkout_and_accounts_configurations: checkout styling sync
# (checkoutStyling.server.ts / syncCheckoutStyling.server.ts). Confirmed via
# validate_graphql_codeblocks. Shopify only allows these on Plus and
# development stores; the app checks the plan before using them.
#
# read_files / write_files: copying the logos and custom fonts that
# checkout styling points at (stylingFiles.server.ts): file IDs are
# per-store. Confirmed via validate_graphql_codeblocks.
scopes = "read_metaobject_definitions,write_metaobject_definitions,write_products,write_customers,write_orders,write_content,read_legal_policies,write_legal_policies,read_metaobjects,write_metaobjects,read_online_store_navigation,write_online_store_navigation,read_locations,write_locations,read_checkout_and_accounts_configurations,write_checkout_and_accounts_configurations,read_files,write_files"
use_legacy_install_flow = false

[webhooks]
# Pinned 2026-10 (latest stable as of Oct 2026). Re-check quarterly per AGENTS.md §2.
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory for public apps: see:
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  # StoreBridge holds no customer records, emails or values; the only
  # customer trace is job history from customer metafield value sync
  # (rows keyed by the source customer's GID). customers/data_request
  # records the request for the in-app Data requests page, which shows and
  # exports those rows; customers/redact deletes them (and the customer's
  # requests); shop/redact erases the shop's data. See each handler's doc
  # comment. Customer value sync also needs
  # protected customer data access approved in the Partner Dashboard.

  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[auth]
redirect_urls = [ ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
