name: Deploy Shopify app config

# Staging deploys continuously (push to `staging` — that's the point of
# having a staging branch: every merge there ships to the staging Shopify
# app + Vercel Preview immediately, no extra gate).
#
# Production is release-gated, deliberately not "push to main": pushing a
# `v*` tag is what ships shopify.app.toml + the Vercel production build.
# Merging a PR to main only runs CI (see ci.yml) — it does not deploy
# anything by itself. Cut a release by tagging the commit on main you want
# live:
#   git tag v1.2.0 && git push origin v1.2.0
# (or use GitHub's "Draft a new release" UI, which pushes the tag for you).
#
# Manual workflow_dispatch runs can still target either environment
# on-demand, independent of the above.
#
# `shopify app deploy` only actually runs when shopify.app*.toml,
# shopify.web.toml, or extensions/ changed since the last deploy
# (check-shopify-changes job) — the Vercel deploy step isn't gated by
# this, since app code changes still need to ship every release
# regardless of whether the Shopify config side changed.
#
# Requires:
#   SHOPIFY_APP_AUTOMATION_TOKEN — Partner/Dev Dashboard app -> Automation
#     tokens. The older SHOPIFY_CLI_PARTNERS_TOKEN is deprecated as of the
#     CLI 4.x / May 2026 rollout — don't use it here.
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — only needed for the
#     production leg's Vercel deploy step. Vercel's own Git integration
#     must have `main` removed from its auto-deploy-to-production branches
#     (Project Settings -> Git) or it'll keep shipping production on every
#     push there regardless of this workflow.

on:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

  # shopify app deploy pushes the whole app config (scopes, webhooks,
  # extensions) every time it runs — worth skipping when nothing that
  # actually affects it changed, rather than re-deploying identical config
  # on every release/staging push. A manual workflow_dispatch always
  # deploys regardless (that's an explicit request, not worth second-
  # guessing).
  check-shopify-changes:
    name: Check for Shopify config changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history + tags, needed to diff against the previous release/push below

      - name: Check
        id: check
        run: |
          PATHS="apps/storebridge/shopify.app.toml apps/storebridge/shopify.app.staging.toml apps/storebridge/shopify.web.toml apps/storebridge/extensions"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying regardless of changed paths."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            # Diff against the previous v* release tag, not just the
            # previous commit — a tag can (and usually does) sit many
            # commits ahead of the last release.
            BASE=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -vx "${{ github.ref_name }}" | head -1)
            if [ -z "$BASE" ]; then
              echo "No previous release tag found — deploying (first release)."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Push to staging: diff against the pre-push state of the
            # branch. Fall back to the immediate parent commit for a
            # brand-new branch (before is all-zeros).
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi
          fi

          echo "Diffing $BASE..HEAD for: $PATHS"
          if git diff --quiet "$BASE" HEAD -- $PATHS; then
            echo "No relevant changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, check-shopify-changes]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Keep in sync with .github/workflows/ci.yml's pin.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shopify CLI 4.x is required for SHOPIFY_APP_AUTOMATION_TOKEN support
      # and the --allow-updates flag. It's intentionally not a project
      # dependency (see AGENTS.md / Dockerfile) — install it fresh here.
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@^4.0.0

      # The Shopify app (shopify.app.*.toml, extensions/) now lives in
      # apps/storebridge under the Turborepo monorepo layout — run the CLI
      # from there so it finds the right config.
      - name: Deploy app config
        if: needs.check-shopify-changes.outputs.changed == 'true'
        working-directory: apps/storebridge
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          ENV="${{ needs.resolve-environment.outputs.environment }}"
          echo "Deploying shopify.app.$ENV.toml"
          shopify app deploy --config "$ENV" --allow-updates

      - name: Skip Shopify config deploy
        if: needs.check-shopify-changes.outputs.changed != 'true'
        run: echo "No changes to shopify.app*.toml/shopify.web.toml/extensions — skipping shopify app deploy."

      # Production hosting only — staging's Vercel Preview deployment is
      # already handled by Vercel's own Git integration on push to
      # `staging` (see DEPLOYMENT.md), no separate step needed here.
      - name: Deploy to Vercel (production)
        if: needs.resolve-environment.outputs.environment == 'production'
        working-directory: apps/storebridge
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
