name: Deploy Shopify app config

# Trunk-based branches map to environments:
#   push to `staging` -> shopify.app.staging.toml   (staging Shopify app)
#   push to `main`     -> shopify.app.toml            (production Shopify app)
# Manual runs (workflow_dispatch) can target either environment on demand.
#
# Requires a SHOPIFY_APP_AUTOMATION_TOKEN repo secret (Settings -> Secrets
# and variables -> Actions). Generate one from the app's Partner/Dev
# Dashboard page -> "Automation tokens". The older SHOPIFY_CLI_PARTNERS_TOKEN
# is deprecated as of the CLI 4.x / May 2026 rollout — don't use it here.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # Keep in sync with .github/workflows/ci.yml's pin — see that file's
      # comment for why this is pinned explicitly rather than relying on
      # whatever npm the Node install happens to bundle.
      - name: Pin npm version
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      # Shopify CLI 4.x is required for SHOPIFY_APP_AUTOMATION_TOKEN support
      # and the --allow-updates flag. It's intentionally not a project
      # dependency (see AGENTS.md / Dockerfile) — install it fresh here.
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@^4.0.0

      - name: Deploy app config
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "Deploying shopify.app.$ENV.toml"
          shopify app deploy --config "$ENV" --allow-updates
