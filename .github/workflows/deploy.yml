name: Deploy Shopify app config

# Every push to `main` ships. Vercel's own Git integration builds and
# deploys the app itself (production = `main`); its build runs
# package.json's `vercel-build` script, `drizzle-kit migrate` then
# `react-router build`, so a failed migration fails the deploy. This
# workflow only deploys the Shopify app config (shopify.app.toml: scopes,
# webhooks, URLs), which never touches the database, so it runs on its own
# rather than waiting on the Vercel build. See DEPLOYMENT.md.
#
# Requires:
#   SHOPIFY_APP_AUTOMATION_TOKEN on the `production` GitHub Environment:
#     Dev Dashboard app -> Automation tokens. The older
#     SHOPIFY_CLI_PARTNERS_TOKEN is deprecated as of the CLI 4.x / May 2026
#     rollout: don't use it here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shopify-config
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shopify app config
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `git describe` below needs the tags.
          fetch-depth: 0

      # Keep in sync with .github/workflows/ci.yml's pin.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shopify CLI 4.x is required for SHOPIFY_APP_AUTOMATION_TOKEN support
      # and the --allow-updates flag. It's intentionally not a project
      # dependency (see AGENTS.md / Dockerfile): install it fresh here.
      # pnpm/setup provisions Node/pnpm's own managed PATH, which `npm
      # install -g` doesn't land on: install through pnpm so the `shopify`
      # binary actually resolves in later steps.
      - name: Install Shopify CLI
        run: pnpm add -g @shopify/cli@^4.0.0

      # Names each app version so Shopify's version list reads like a
      # changelog instead of the CLI's "app-name-<random>": the latest
      # reachable tag (0.0.0 if none) plus this run's number, e.g. 1.2.0-42.
      - name: Resolve version
        id: version
        run: |
          BASE="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          VERSION="${BASE:-0.0.0}-${{ github.run_number }}"
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy app config
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          shopify app deploy \
            --version "${{ steps.version.outputs.version }}" \
            --message "Deployed from ${{ github.ref_name }} by run #${{ github.run_number }}" \
            --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --allow-updates
