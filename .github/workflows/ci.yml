# `push` and `pull_request` both fire for a same-repo PR branch (push
# because you pushed a commit, pull_request:synchronize because that branch
# has an open PR) — scoping `push` to just the trunk branches means a PR
# branch only triggers once, via `pull_request`, instead of running every
# job twice for the identical commit.
on:
  push:
    branches: [main, staging]
  pull_request:

name: CI

jobs:
  CI:
    name: CI_Node_${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom@30 (used by the test suite) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
        # Keep this in sync with the "engines" field in package.json.
        version: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      # The npm version bundled with a Node install differs by major version
      # (e.g. Node 24 ships npm 11, Node 22 ships npm 10), and `npm ci`'s
      # lockfile validation isn't guaranteed cross-compatible between npm
      # majors for one committed lockfile — pin explicitly so every matrix
      # leg (and local devs) validate against the same npm. Keep in sync
      # with the version used to generate package-lock.json.
      - name: Pin npm version
        run: npm install -g npm@11.16.0
      - name: Install
        run: npm ci
      # Prisma client generation is wired into turbo's task graph (lint,
      # typecheck, test, build all `dependsOn: ["db:generate"]` where
      # needed via turbo.json), so there's no separate step for it here.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_APP_URL: https://ci-placeholder.example.com
      # One leg's coverage is enough for the Quality Gate job's PR summary
      # — always() so it still uploads (or harmlessly warns "no files
      # found") if a later step like Build fails after Test succeeded.
      - name: Upload coverage summary
        if: matrix.version == 24 && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: apps/storebridge/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn

  E2E:
    name: E2E
    runs-on: ubuntu-latest
    services:
      # Session storage in production is Supabase Postgres (see
      # apps/storebridge/prisma/schema.prisma) — e2e runs against a real
      # Postgres for the same reason, not sqlite, so a schema mismatch like
      # the one this migration once had (DATETIME instead of TIMESTAMP)
      # can't slip through unnoticed again.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storebridge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storebridge_e2e
      # Any values work — nothing in the e2e suite calls the real Shopify
      # API, it forges its own session token locally. See
      # apps/storebridge/e2e/support/embedded-fixture.ts.
      SHOPIFY_API_KEY: ci-e2e-api-key
      SHOPIFY_API_SECRET: ci-e2e-api-secret
      SCOPES: read_products
      SHOPIFY_APP_URL: http://localhost:3000
      PORT: "3000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm version
        run: npm install -g npm@11.16.0
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/storebridge
        run: npx playwright install --with-deps chromium
      - name: Run database migrations
        working-directory: apps/storebridge
        run: npx prisma migrate deploy
      - name: E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/storebridge/playwright-report/
          retention-days: 7

  # Single aggregate status — the one check to require in branch protection
  # instead of naming every CI/E2E matrix leg individually — plus the PR
  # summary comment. `always()` so it runs (and reports) even when CI/E2E
  # failed; it fails itself at the end based on their actual results.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [CI, E2E]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # absent when CI failed before the Test step ever ran
        with:
          name: coverage-summary
          path: coverage

      - name: Post summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const ciResult = '${{ needs.CI.result }}';
            const e2eResult = '${{ needs.E2E.result }}';
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⚪' : '❌');

            let coverageSection = '_Coverage report unavailable (CI likely failed before tests ran)._';
            try {
              const { total } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
              coverageSection = [
                '| Metric | Coverage |',
                '| --- | --- |',
                `| Statements | ${pct(total.statements)} |`,
                `| Branches | ${pct(total.branches)} |`,
                `| Functions | ${pct(total.functions)} |`,
                `| Lines | ${pct(total.lines)} |`,
              ].join('\n');
            } catch {}

            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const marker = '<!-- storebridge-quality-gate -->';
            const body = [
              marker,
              '## Quality Gate',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| CI — lint, typecheck, unit tests, build (Node 22 & 24) | ${icon(ciResult)} |`,
              `| E2E | ${icon(e2eResult)} |`,
              '',
              '### Unit test coverage (Node 24)',
              '',
              coverageSection,
              '',
              `[Full run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if CI or E2E failed
        if: needs.CI.result != 'success' || needs.E2E.result != 'success'
        run: exit 1
