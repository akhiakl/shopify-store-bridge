on: [push, pull_request]

name: CI

jobs:
  CI:
    name: CI_Node_${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom@30 (used by the test suite) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
        # Keep this in sync with the "engines" field in package.json.
        version: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_APP_URL: https://ci-placeholder.example.com
