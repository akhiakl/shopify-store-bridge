# `push` and `pull_request` both fire for a same-repo PR branch (push
# because you pushed a commit, pull_request:synchronize because that branch
# has an open PR): scoping `push` to just the trunk branches means a PR
# branch only triggers once, via `pull_request`, instead of running every
# job twice for the identical commit.
on:
  push:
    branches: [main, staging]
  pull_request:

name: Quality Checks

jobs:
  verify:
    name: Lint, Typecheck & Test (Node ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom@30 (used by the test suite) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
        # Keep this in sync with the "engines" field in package.json.
        version: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Installs pnpm (version read from package.json's "packageManager"
      # field: keep that in sync rather than pinning a version here too)
      # and this leg's Node version in one step, plus caches the pnpm
      # store. `pnpm install` (below) auto-detects the CI env var GitHub
      # Actions sets and runs in frozen-lockfile mode, npm ci's equivalent.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.version }}
          cache: true
          install: false
      # Every check below runs even when an earlier one fails (akhiakl/
      # ci-workflows@v1 tees each command's output to ci-results/<name>.log
      # and records its outcome into ci-results/outcomes.json), so the
      # Quality Gate comment can list what failed in all of them. The job
      # still fails at the end if any of them did.
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: install
        with:
          name: install
          run: pnpm install --frozen-lockfile
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: lint
        continue-on-error: true
        with:
          name: lint
          run: pnpm run lint
      # Regenerates app/types/* from the live Admin API schema (AGENTS.md
      # §7: every GraphQL operation should pass codegen). Not checked in
      # (see .gitignore) since it fetches from shopify.dev each run,
      # keeping it current with whatever API version .graphqlrc.ts pins.
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: codegen
        continue-on-error: true
        with:
          name: codegen
          run: pnpm run graphql-codegen
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: typecheck
        continue-on-error: true
        with:
          name: typecheck
          run: pnpm run typecheck
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: test
        continue-on-error: true
        with:
          name: test
          run: >-
            pnpm run test:coverage --reporter=default --reporter=json
            --outputFile.json=ci-results/test-results.json
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: build
        continue-on-error: true
        env:
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_APP_URL: https://ci-placeholder.example.com
        with:
          name: build
          run: pnpm run build
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-node-${{ matrix.version }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn
      # One leg's coverage is enough for the Quality Gate job's PR summary -
      # always() so it still uploads (or harmlessly warns "no files
      # found") if a later step like Build fails after Test succeeded.
      - name: Upload coverage summary
        if: matrix.version == 24 && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if any check failed
        if: >-
          steps.lint.outcome == 'failure' || steps.codegen.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    # A cold Playwright install + the suite itself normally finishes well
    # under 10 minutes: cap it so a hung install/download (observed once:
    # a run sat "in progress" for 40+ minutes) fails fast instead of tying
    # up the runner and blocking the Quality Gate indefinitely.
    timeout-minutes: 15
    services:
      # Session storage in production is Supabase Postgres (see
      # app/db/schema.server.ts): e2e runs against a real
      # Postgres for the same reason, not sqlite, so a schema mismatch like
      # the one this migration once had (DATETIME instead of TIMESTAMP)
      # can't slip through unnoticed again.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storebridge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storebridge_e2e
      # Any values work: nothing in the e2e suite calls the real Shopify
      # API, it forges its own session token locally. See
      # e2e/support/embedded-fixture.ts.
      SHOPIFY_API_KEY: ci-e2e-api-key
      SHOPIFY_API_SECRET: ci-e2e-api-secret
      SCOPES: read_products
      SHOPIFY_APP_URL: http://localhost:3000
      PORT: "3000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      # Output goes to ci-results/ for the Quality Gate comment, as in the
      # verify job.
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: install
        with:
          name: install
          run: pnpm install --frozen-lockfile
      # The Chromium binary download (~100MB) is what makes "install
      # Playwright" slow, not the OS package install: cache it keyed on
      # the actually-installed @playwright/test version so a version bump
      # invalidates the cache automatically. OS-level deps still have to
      # install every run regardless of cache-hit: GitHub-hosted runners
      # are a fresh VM each time, and actions/cache can't persist system
      # packages, only files under the given path.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Production Postgres is Supabase, which ships a built-in
      # `service_role` role: the RLS policies in schema.server.ts
      # (`serviceRoleOnly`, via drizzle-orm/supabase's `serviceRole`) all
      # grant access `TO "service_role"`. This plain postgres:16 service
      # container has no such role, so `drizzle-kit migrate` fails on the
      # first `CREATE POLICY ... TO "service_role"` statement without it.
      - name: Create Supabase roles for RLS policies
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d storebridge_e2e \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF; END \$\$;"
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: migrate
        with:
          name: migrate
          run: pnpm exec drizzle-kit migrate
      # Playwright also writes ci-results/playwright-results.json on CI
      # (see playwright.config.ts).
      - uses: akhiakl/ci-workflows@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        id: e2e
        with:
          name: e2e
          run: pnpm run test:e2e
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-e2e
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Single aggregate status: the one check to require in branch protection
  # instead of naming every verify/e2e matrix leg individually, plus the
  # PR summary comment. `always()` so it runs (and reports) even when
  # verify/e2e failed; it fails itself at the end based on their results.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # absent when CI failed before the Test step ever ran
        with:
          name: coverage-summary
          path: coverage

      - uses: akhiakl/ci-workflows/gate@e0badeea75937a3fe62095d27fc697d71570d216 # v1
        with:
          marker: '<!-- storebridge-quality-gate -->'
          title: Quality Gate
          coverage-summary-path: coverage/coverage-summary.json
          status: |
            Lint, Typecheck & Test (Node 22 & 24)=${{ needs.verify.result }}
            End-to-End Tests=${{ needs.e2e.result }}

      - name: Fail if verify or e2e failed
        if: needs.verify.result != 'success' || needs.e2e.result != 'success'
        run: exit 1
